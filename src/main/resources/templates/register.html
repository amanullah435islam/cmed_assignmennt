<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <!-- CSS লিঙ্ক যোগ করুন -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script th:inline="javascript">
        /*<![CDATA[*/
        const errorMsg = /*[[${error}]]*/ null;
        const successMsg = /*[[${success}]]*/ null;
        if (errorMsg) {
            alert(errorMsg);
        }
        if (successMsg) {
            alert(successMsg);
        }
        /*]]>*/
    </script>
</head>
<body class="register-page">
    <div class="register-container">  <!-- container div যোগ করুন -->
        <h2>Register</h2>

        <form class="register-form" th:action="@{/register}" method="post" th:object="${user}">
            <div>
                <label>Name:</label>
                <input type="text" th:field="*{name}" required />
            </div>
            
            <div>
                <label>Username:</label>
                <input type="text" th:field="*{username}" required />
            </div>

            <div>
                <label>Password:</label>
                <input type="password" th:field="*{password}" required />
            </div>

            <div>
                <label>Role:</label>
                <select th:field="*{userRole}">
                    <option value="USER">USER</option>
                    <option value="ADMIN">ADMIN</option>
                </select>
            </div>

            <div>
                <button type="submit" class="register-btn">Register</button>
            </div>
        </form>

        <div class="register-link">
            <a th:href="@{/login}">Already have an account? Login here</a>
        </div>
    </div>
</body>
</html>
